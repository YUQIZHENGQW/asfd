<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名著推荐 - 阅读点亮人生</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>📚 名著推荐</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#featured">精选推荐</a></li>
                <li><a href="#categories">分类浏览</a></li>
                <li><a href="#reviews">书友书评</a></li>
            </ul>
        </nav>
        <div class="hero">
            <h2>阅读是一场心灵的旅行</h2>
            <p>探索世界文学经典，品味大师智慧结晶</p>
        </div>
    </header>

    <main>
        <section id="featured" class="section">
            <h2 class="section-title">✨ 精选名著推荐</h2>
            <div class="books-grid" id="featuredBooks">
                <!-- 书籍将通过JavaScript动态加载 -->
            </div>
        </section>

        <section id="categories" class="section">
            <h2 class="section-title">📖 分类浏览</h2>
            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">全部</button>
                <button class="tab-btn" data-category="foreign">外国文学</button>
                <button class="tab-btn" data-category="chinese">中国文学</button>
                <button class="tab-btn" data-category="philosophy">哲学思想</button>
            </div>
            <div class="books-grid" id="categoryBooks">
                <!-- 书籍将通过JavaScript动态加载 -->
            </div>
        </section>

        <section id="book-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div class="book-detail" id="bookDetail">
                    <!-- 书籍详情将动态加载 -->
                </div>
            </div>
        </section>

        <section id="reviews" class="section">
            <h2 class="section-title">💬 书友书评</h2>
            <div class="reviews-container" id="reviewsContainer">
                <!-- 书评将通过JavaScript动态加载 -->
            </div>
            <div class="add-review">
                <h3>分享你的阅读感受</h3>
                <form id="reviewForm">
                    <div class="form-group">
                        <label for="reviewerName">你的昵称</label>
                        <input type="text" id="reviewerName" placeholder="请输入昵称" required>
                    </div>
                    <div class="form-group">
                        <label for="reviewBook">推荐书籍</label>
                        <select id="reviewBook" required>
                            <option value="">请选择书籍</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reviewRating">评分</label>
                        <div class="star-rating" id="starRating">
                            <span data-value="1">★</span>
                            <span data-value="2">★</span>
                            <span data-value="3">★</span>
                            <span data-value="4">★</span>
                            <span data-value="5">★</span>
                        </div>
                        <input type="hidden" id="reviewRating" value="0">
                    </div>
                    <div class="form-group">
                        <label for="reviewContent">书评内容</label>
                        <textarea id="reviewContent" rows="4" placeholder="分享你的阅读体验和感悟..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">发布书评</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 名著推荐 | 让阅读成为一种生活方式</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
